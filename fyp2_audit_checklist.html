function render() {
  const container = document.getElementById('checklist');
  const state = JSON.parse(localStorage.getItem('fyp-checklist') || '{}');
  container.innerHTML = '';

  let total = 0, done = 0;

  sections.forEach((sec, si) => {
    const secDone = sec.items.filter((_, ii) => state[`${si}-${ii}`]).length;
    const secTotal = sec.items.length;
    total += secTotal; done += secDone;

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `<i class="ti ${sec.icon}" aria-hidden="true"></i><span class="section-title">${sec.title}</span><span class="section-count">${secDone}/${secTotal}</span>`;
    container.appendChild(hdr);

    sec.items.forEach((item, ii) => {
      const key = `${si}-${ii}`;
      const checked = !!state[key];
      const el = document.createElement('div');
      el.className = 'item' + (checked ? ' checked' : '');
      el.innerHTML = `<div class="cb"><i class="ti ti-check" aria-hidden="true"></i></div><span class="label">${item.label}</span><span class="badge ${item.badge}">${item.badge.replace('b-','').replace('-',' ')}</span>`;
      el.addEventListener('click', () => {
        state[key] = !state[key];
        try { localStorage.setItem('fyp-checklist', JSON.stringify(state)); } catch(e) {}
        render();
      });
      container.appendChild(el);
    });
  });

  document.getElementById('total-num').textContent = total;
  document.getElementById('done-num').textContent = done;
  document.getElementById('left-num').textContent = total - done;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pct-num').textContent = pct + '%';
  document.getElementById('pbar').style.width = pct + '%';
}

render();
