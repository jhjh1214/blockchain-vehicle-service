<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
        </svg>
      </div>
      <h1 class="auth-title">VehicleChain</h1>
      <p class="auth-subtitle">Blockchain-Powered Vehicle Service Platform</p>
    </div>

    <div class="auth-card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group mb-16">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="f['email'].invalid && f['email'].touched"
            placeholder="you@company.com"
            autocomplete="email"
          />
          <div *ngIf="f['email'].invalid && f['email'].touched" class="invalid-feedback">
            Please enter a valid email address
          </div>
        </div>

        <div class="form-group mb-24">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="form-control"
            [class.is-invalid]="f['password'].invalid && f['password'].touched"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <div *ngIf="f['password'].invalid && f['password'].touched" class="invalid-feedback">
            Password is required
          </div>
        </div>

        <div *ngIf="error" class="alert alert-danger mb-16">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
          {{ error }}
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          [disabled]="loading || loginForm.invalid"
        >
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Sign In</span>
        </button>
      </form>

      <div class="auth-footer-link">
        Don't have an account? <a routerLink="/register">Register here</a>
      </div>

      <div class="auth-note">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
        </svg>
        Connected to private blockchain network
      </div>
    </div>
  </div>
</div>
